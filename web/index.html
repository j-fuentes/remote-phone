<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RemotePhone Web</title>
<meta name="description" content="Mirror and control an Android phone from the browser: no install, no build step.">
<meta name="theme-color" content="#1e1f25">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RemotePhone">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* Material 3 dark scheme (blue seed). No web fonts or libraries: the page must work offline */
  :root {
    color-scheme: dark;
    --primary:#a8c7fa; --on-primary:#062e6f;
    --surface:#121318; --surface-container:#1e1f25; --surface-high:#282a2f; --surface-highest:#33353a;
    --on-surface:#e3e2e9; --on-surface-variant:#c4c6d0; --outline:#8e9099; --outline-variant:#44474f;
    --error:#ffb4ab; --success:#7ddb9e;
    --ease: cubic-bezier(.2,0,0,1);
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--surface); color:var(--on-surface);
    font:14px/20px Roboto, "Google Sans", system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing:.1px; }
  body { display:flex; flex-direction:column; overflow:hidden; }
  svg.i { width:24px; height:24px; fill:currentColor; flex:none; display:block; }

  /* ---- Top app bar ---- */
  .top-bar { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; padding:8px 12px;
    padding-top:max(8px, env(safe-area-inset-top)); padding-left:max(12px, env(safe-area-inset-left)); padding-right:max(12px, env(safe-area-inset-right));
    background:var(--surface-container); position:relative; z-index:3; }
  .brand { display:flex; align-items:center; gap:8px; font-size:18px; font-weight:500; margin-right:4px; white-space:nowrap; }
  .brand svg { color:var(--primary); }
  .grow { flex:1; }
  .group { display:flex; align-items:center; gap:4px; }

  /* Outlined text field with floating label */
  .field { position:relative; display:block; }
  .field input { height:40px; width:100%; padding:0 12px; border-radius:4px; border:1px solid var(--outline);
    background:transparent; color:var(--on-surface); font:inherit; font-size:15px; outline:none; transition:border-color .15s; }
  .field input:hover:not(:disabled) { border-color:var(--on-surface); }
  .field input:focus { border:2px solid var(--primary); padding:0 11px; }
  .field input:disabled { opacity:.6; }
  .field span { position:absolute; left:9px; top:10px; padding:0 4px; color:var(--on-surface-variant); pointer-events:none;
    background:var(--surface-container); transition:all .15s var(--ease); font-size:15px; line-height:20px; }
  .field input:focus + span, .field input:not(:placeholder-shown) + span { top:-9px; font-size:12px; line-height:16px; }
  .field input:focus + span { color:var(--primary); }
  #hostField { width:180px; } #portField { width:84px; }

  /* Icon buttons: standard and filled, with the M3 state layer */
  .icon-btn { position:relative; width:40px; height:40px; border-radius:20px; border:0; padding:8px; cursor:pointer;
    background:transparent; color:var(--on-surface-variant); display:inline-flex; align-items:center; justify-content:center;
    transition:background-color .2s, color .2s, opacity .15s; -webkit-tap-highlight-color:transparent; }
  .icon-btn::before { content:""; position:absolute; inset:0; border-radius:inherit; background:currentColor; opacity:0; transition:opacity .15s; }
  .icon-btn:hover:not(:disabled)::before { opacity:.08; }
  .icon-btn:active:not(:disabled)::before { opacity:.12; }
  .icon-btn:focus-visible { outline:2px solid var(--primary); outline-offset:2px; }
  .icon-btn:disabled { opacity:.38; cursor:default; }
  .icon-btn.filled { background:var(--primary); color:var(--on-primary); }
  .icon-btn.danger { background:var(--surface-highest); color:var(--error); }
  .icon-btn[hidden] { display:none; }
  .icon-btn[aria-pressed="true"] { background:var(--primary); color:var(--on-primary); }
  /* Phone screen controls: only while the phone streams a desktop (DeX) */
  .phone-screen { display:none !important; }
  body.phone-screen-control .phone-screen { display:inline-flex !important; }
  body.phone-screen-control .sep.phone-screen { display:block !important; }

  /* Switch */
  .switch { display:inline-flex; align-items:center; gap:8px; color:var(--on-surface-variant); cursor:pointer; user-select:none; }
  .switch input { appearance:none; -webkit-appearance:none; margin:0; position:relative; width:52px; height:32px; border-radius:16px;
    background:var(--surface-highest); border:2px solid var(--outline); cursor:pointer; transition:background-color .2s, border-color .2s; flex:none; }
  .switch input::after { content:""; position:absolute; top:6px; left:6px; width:16px; height:16px; border-radius:50%; background:var(--outline);
    transition:all .2s var(--ease); }
  .switch input:checked { background:var(--primary); border-color:var(--primary); }
  .switch input:checked::after { left:22px; top:2px; width:24px; height:24px; background:var(--on-primary); }
  .switch input:active:not(:disabled)::after { width:28px; height:28px; top:0; left:0; }
  .switch input:checked:active:not(:disabled)::after { left:20px; }
  .switch input:focus-visible { outline:2px solid var(--primary); outline-offset:2px; }
  .switch input:disabled { opacity:.38; cursor:default; }
  .switch:has(input:disabled) { cursor:default; }
  .switch:has(input:disabled) svg { opacity:.38; }
  .switch:has(input:checked) svg { color:var(--primary); }

  /* Status chip */
  #status { display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 12px 0 10px; border-radius:8px;
    border:1px solid var(--outline-variant); color:var(--on-surface-variant); font-size:13px; font-weight:500;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:min(42vw, 420px); }
  #status::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--outline); flex:none; }
  #status.ok { color:var(--on-surface); } #status.ok::before { background:var(--success); box-shadow:0 0 0 3px #7ddb9e33; }
  #status.err { color:var(--error); } #status.err::before { background:var(--error); }

  /* Menu (certificate fingerprint) */
  details.menu { position:relative; }
  details.menu > summary { list-style:none; }
  details.menu > summary::-webkit-details-marker { display:none; }
  details.menu[open] > summary { background:var(--surface-highest); color:var(--on-surface); }
  .menu-panel { position:absolute; right:0; top:48px; width:min(360px, calc(100vw - 24px)); padding:16px; border-radius:12px;
    background:var(--surface-high); box-shadow:0 2px 6px 2px #0000004d, 0 1px 2px #0000004d; z-index:10; animation:pop .15s var(--ease); }
  .menu-panel h3 { margin:0 0 4px; font-size:14px; font-weight:500; }
  .menu-panel p { margin:0 0 14px; color:var(--on-surface-variant); font-size:12px; line-height:16px; }
  .menu-panel .field span { background:var(--surface-high); }
  .menu-panel input { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; }
  /* Invalid fingerprint: error outline, label and supporting text, plus a badge on the key button */
  .field.invalid input, .field.invalid input:focus { border-color:var(--error); }
  .field.invalid span, .field.invalid input:focus + span { color:var(--error); }
  #fpmsg { display:none; margin:4px 16px 0; font-size:12px; line-height:16px; color:var(--error); }
  details.menu.invalid > summary { color:var(--error); }
  details.menu.invalid > summary::after { content:""; position:absolute; top:7px; right:7px; width:8px; height:8px; border-radius:50%; background:var(--error); }
  @keyframes pop { from { opacity:0; transform:translateY(-4px) scale(.98); } }

  /* ---- Stage ---- */
  #stage { flex:1; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; outline:none;
    background:radial-gradient(ellipse at 50% 40%, #1b1d24 0%, var(--surface) 70%); }
  #screen { display:block; background:#000; touch-action:none; cursor:default; border-radius:14px;
    box-shadow:0 0 0 1px #ffffff14, 0 8px 24px #00000080; }
  body.desktop #screen, body.bars-hidden #screen { border-radius:4px; }
  /* No empty black box before the first picture */
  body:not(.has-picture) #screen { visibility:hidden; }
  #hint { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; pointer-events:none; }
  #hint > div { max-width:480px; padding:24px 28px; border-radius:28px; background:var(--surface-high); color:var(--on-surface-variant);
    box-shadow:0 1px 3px 1px #00000026, 0 1px 2px #0000004d; line-height:22px; animation:pop .2s var(--ease); }
  #hint a { color:var(--primary); pointer-events:auto; }
  #hint b { color:var(--on-surface); font-weight:500; }
  code { background:var(--surface-highest); padding:1px 6px; border-radius:6px; font-size:12px; }

  /* ---- Bottom navigation bar ---- */
  .nav-bar { display:flex; align-items:center; justify-content:center; gap:4px; padding:6px 12px;
    padding-bottom:max(6px, env(safe-area-inset-bottom)); background:var(--surface-container); z-index:3; }
  .nav-bar .icon-btn { width:56px; height:40px; }
  .nav-bar .sep { width:1px; height:24px; background:var(--outline-variant); margin:0 8px; }

  /* ---- Hidden bars: full-bleed picture, a small floating button brings them back ---- */
  body.bars-hidden .top-bar, body.bars-hidden .nav-bar { display:none; }
  #showBars { position:fixed; top:max(10px, env(safe-area-inset-top)); right:max(10px, env(safe-area-inset-right)); z-index:20;
    display:none; background:var(--surface-high); color:var(--on-surface); box-shadow:0 1px 3px 1px #00000026, 0 1px 2px #0000004d;
    opacity:.25; transition:opacity .3s; }
  #showBars:hover, #showBars:focus-visible, body.pointer-recent #showBars { opacity:1; }
  body.bars-hidden #showBars { display:inline-flex; }

  /* Tooltips, only where there is a hovering pointer */
  @media (hover:hover) {
    [data-tip]:hover::after { content:attr(data-tip); position:absolute; top:calc(100% + 6px); left:50%; transform:translateX(-50%);
      padding:4px 8px; border-radius:4px; background:var(--on-surface); color:var(--surface); font-size:12px; line-height:16px;
      white-space:nowrap; pointer-events:none; z-index:30; animation:pop .1s var(--ease) .5s both; }
    .nav-bar [data-tip]:hover::after { top:auto; bottom:calc(100% + 6px); }
    .group [data-tip]:hover::after, #showBars:hover::after { left:auto; right:0; transform:none; }
    details.menu[open] > summary::after { display:none; }
  }

  @media (max-width: 640px) {
    .brand span { display:none; }
    #hostField { flex:1; width:auto; min-width:110px; }
    .top-bar .grow { display:none; }
    #status { flex:1 1 0; min-width:0; max-width:none; }
    .nav-bar { gap:0; padding-left:4px; padding-right:4px; }
    .nav-bar .icon-btn { width:44px; }
    .nav-bar .sep { margin:0 2px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<!-- Material Symbols (Apache 2.0), inlined so the app needs nothing from the network -->

</svg>

<header class="top-bar">
  <div class="brand"><svg class="i"><use href="#i-phone"/></svg><span>RemotePhone</span></div>
  <label class="field" id="hostField"><input id="host" placeholder=" " autocomplete="off" spellcheck="false"><span>Phone IP</span></label>
  <label class="field" id="portField"><input id="port" value="8765" placeholder=" " inputmode="numeric"><span>Port</span></label>
  <button id="connect" class="icon-btn filled" aria-label="Connect" data-tip="Connect"><svg class="i"><use href="#i-link"/></svg></button>
  <label class="switch" title="Stream phone audio (Android 10+)"><svg class="i"><use href="#i-volume"/></svg><input type="checkbox" role="switch" id="audio" aria-label="Audio" disabled></label>
  <span class="grow"></span>
  <span id="status">Disconnected</span>
  <div class="group">
    <details class="menu" id="fpMenu">
      <summary class="icon-btn" aria-label="Certificate fingerprint" data-tip="Certificate fingerprint"><svg class="i"><use href="#i-key"/></svg></summary>
      <div class="menu-panel">
        <h3>Certificate fingerprint</h3>
        <p>Optional. With the phone's SHA-256 fingerprint, computers it remembers reconnect without tapping <b>Allow</b> again.</p>
        <label class="field" id="fpField"><input id="fingerprint" placeholder=" " autocomplete="off" spellcheck="false"><span>SHA-256</span></label>
        <div id="fpmsg" role="alert"></div>
      </div>
    </details>
    <button id="install" class="icon-btn" aria-label="Install as an app" data-tip="Install as an app" hidden><svg class="i"><use href="#i-install"/></svg></button>
    <button id="hideBars" class="icon-btn" aria-label="Hide bars (F9)" data-tip="Hide bars (F9)"><svg class="i"><use href="#i-hide-bars"/></svg></button>
  </div>
</header>
<main id="stage" tabindex="0">
  <canvas id="screen" width="360" height="780"></canvas>
  <div id="hint"><div>Enter the IP shown in the RemotePhone app and press <b>Connect</b>.</div></div>
</main>
<nav class="nav-bar">
  <button class="icon-btn" data-key="back" aria-label="Back (Esc / right click)" data-tip="Back"><svg class="i"><use href="#i-back"/></svg></button>
  <button class="icon-btn" data-key="home" aria-label="Home" data-tip="Home"><svg class="i"><use href="#i-home"/></svg></button>
  <button class="icon-btn" data-key="recents" aria-label="Recents (F2)" data-tip="Recents"><svg class="i"><use href="#i-recents"/></svg></button>
  <span class="sep"></span>
  <button class="icon-btn" data-key="notifications" aria-label="Notifications (F5)" data-tip="Notifications"><svg class="i"><use href="#i-bell"/></svg></button>
  <button class="icon-btn" data-key="quick_settings" aria-label="Quick settings (F6)" data-tip="Quick settings"><svg class="i"><use href="#i-tune"/></svg></button>
  <button class="icon-btn" data-key="power" aria-label="Lock (F10)" data-tip="Lock"><svg class="i"><use href="#i-power"/></svg></button>
  <span class="sep phone-screen"></span>
  <button class="icon-btn phone-screen" id="phoneScreenOff" aria-label="Turn the phone screen off" data-tip="Phone screen off" aria-pressed="false"><svg class="i"><use href="#i-phone-off"/></svg></button>
  <button class="icon-btn phone-screen" id="phoneBlackout" aria-label="Black phone screen" data-tip="Black phone screen" aria-pressed="false"><svg class="i"><use href="#i-dark"/></svg></button>
  <span class="sep"></span>
  <button class="icon-btn" id="fullscreen" aria-label="Fullscreen (F11)" data-tip="Fullscreen"><svg class="i"><use href="#i-fullscreen"/></svg></button>
</nav>
<button id="showBars" class="icon-btn" aria-label="Show bars (F9)" data-tip="Show bars"><svg class="i"><use href="#i-menu"/></svg></button>
<script src="remotephone.js"></script>
</body>
</html>
