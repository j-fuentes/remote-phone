name: Build APK (desktop mode branch)

# Debug build for testing the dex-desktop branch on a phone; releases still come from release.yml
on:
  push:
    branches: [dex-desktop]
    paths: ['android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: RemotePhone-desktop-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-reports
          path: android/app/build/reports
          if-no-files-found: ignore
